<title>Engineering Computer Tree Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: três profundidades — céu (áreas, radial) → constelação (branch) → página (nó, sóbria).
   Fundo sólido quase preto com viés azul; a cor só existe nas áreas e acende com o progresso. */
:root {
  color-scheme: dark;
  --bg: #080b10;
  --bg-raised: #0e131a;
  --bg-panel: #111821;
  --line: #1a222d;
  --line-strong: #283240;
  --ink: #e4e9f0;
  --ink-muted: #96a1b0;
  --ink-faint: #78849a;

  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

  --ease: cubic-bezier(.22, .9, .24, 1);
  --t-fast: 160ms;
  --t-med: 380ms;
  --t-slow: 700ms;

  --c: #f5c46b;             /* cor da área corrente, sobrescrita por contexto */
  --glow: color-mix(in srgb, var(--c) 28%, transparent);
  --soft: color-mix(in srgb, var(--c) 12%, transparent);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--c); outline-offset: 3px; border-radius: 4px; }
::selection { background: var(--soft); color: var(--ink); }

#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; transition: opacity var(--t-slow) var(--ease); }
body[data-view="node"] #stars { opacity: .18; }
#app { position: relative; z-index: 1; min-height: 100%; display: flex; flex-direction: column; }

/* ── Barra superior ───────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 24px 14px;
  font-size: 13px; color: var(--ink-faint);
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink-muted); font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; white-space: nowrap; }
.brand svg { width: 20px; height: 20px; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
.crumbs button { color: var(--ink-faint); white-space: nowrap; transition: color var(--t-fast); }
.crumbs button:hover { color: var(--ink); }
.crumbs .sep { opacity: .5; }
.crumbs .here { color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .total { margin-left: auto; font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
.topbar .total b { color: var(--ink); font-weight: 500; }

.eyebrow { font-family: var(--font-display); font-size: 12px; font-weight: 400; letter-spacing: .42em; text-transform: uppercase; color: var(--ink-faint); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.view { flex: 1; display: flex; flex-direction: column; animation: view-in var(--t-slow) var(--ease) both; }
@keyframes view-in { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }

/* ── Céu: áreas ────────────────────────────────────────────────── */
.sky { flex: 1; display: grid; place-items: center; padding: 8px 16px 32px; }
.stage { position: relative; width: min(92vw, calc(100vh - 150px), 780px); aspect-ratio: 1; }
.stage > svg.links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.links .ring { fill: none; stroke: var(--line); stroke-width: 1; }
.links .spoke { stroke-width: 1; opacity: .45; transition: opacity var(--t-med) var(--ease); }
.links .spoke.on { opacity: 1; }
.core {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 23%; aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center; text-align: center;
  border: 1px solid var(--line-strong);
  box-shadow: 0 0 0 10px var(--bg), 0 0 0 11px var(--line), 0 0 60px rgba(110, 160, 255, .06) inset;
  background: radial-gradient(circle, #0d1219 0%, var(--bg) 70%);
}
.core .name { font-family: var(--font-display); font-weight: 300; font-size: clamp(14px, 2.2vw, 19px); color: var(--ink); }
.core .count { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
.orb {
  position: absolute; transform: translate(-50%, -50%);
  width: 12.5%; aspect-ratio: 1;
  display: grid; place-items: center;
  border-radius: 50%;
  animation: orb-in var(--t-slow) var(--ease) both;
  animation-delay: calc(var(--i) * 45ms + 120ms);
}
@keyframes orb-in { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } }
.orb .disc {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1.5px solid var(--c);
  background: radial-gradient(circle, color-mix(in srgb, var(--c) 9%, var(--bg)) 0%, var(--bg) 72%);
  box-shadow: 0 0 22px var(--glow), inset 0 0 14px color-mix(in srgb, var(--c) 10%, transparent);
  transition: box-shadow var(--t-med) var(--ease), transform var(--t-med) var(--ease);
}
.orb .halo { position: absolute; inset: -14%; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--c) 22%, transparent); }
.orb svg.arc { position: absolute; inset: -14%; width: 128%; height: 128%; transform: rotate(-90deg); }
.orb svg.arc circle { fill: none; stroke: var(--c); stroke-width: 2; stroke-linecap: round; }
.orb .icon { position: relative; width: 42%; height: 42%; color: var(--c); }
.orb .label {
  position: absolute; top: calc(100% + 18%); left: 50%; transform: translateX(-50%);
  white-space: nowrap; font-size: clamp(11px, 1.45vw, 13.5px); color: var(--ink);
  text-align: center; line-height: 1.3;
}
.orb .label small { display: block; color: var(--ink-faint); font-size: .85em; }
.orb:hover .disc, .orb:focus-visible .disc { box-shadow: 0 0 40px color-mix(in srgb, var(--c) 45%, transparent), inset 0 0 18px color-mix(in srgb, var(--c) 18%, transparent); transform: scale(1.06); }
.stage.zoom .orb:not(.picked), .stage.zoom .core, .stage.zoom svg.links { opacity: 0; transition: opacity var(--t-med) var(--ease); }
.stage.zoom .orb.picked { transition: transform var(--t-med) var(--ease), left var(--t-med) var(--ease), top var(--t-med) var(--ease); left: 50% !important; top: 50% !important; transform: translate(-50%, -50%) scale(2.2); }
.sky-hint { margin-top: 18px; display: flex; align-items: center; gap: 14px; color: var(--ink-faint); font-size: 12.5px; letter-spacing: .12em; }
.sky-hint::before, .sky-hint::after { content: ""; width: 64px; height: 1px; background: var(--line-strong); }

.area-list { display: none; }

/* ── Área: carrossel de branches ───────────────────────────────── */
.area-head { text-align: center; padding: 8px 16px 0; }
.area-head .eyebrow { color: var(--c); }
.area-head p { margin: 6px 0 0; color: var(--ink-faint); font-size: 13px; }
.carousel { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; touch-action: pan-y; padding-block: 12px; }
.track { display: flex; gap: var(--gap); transition: transform var(--t-slow) var(--ease); will-change: transform; }
.bcard {
  flex: 0 0 var(--w); display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 18px 16px 20px; border-radius: 14px; text-align: center;
  transform: scale(.78); opacity: .38; filter: saturate(.6);
  transition: transform var(--t-slow) var(--ease), opacity var(--t-slow) var(--ease), filter var(--t-slow) var(--ease), background var(--t-med);
}
.bcard.near { opacity: .55; }
.bcard.on { transform: scale(1); opacity: 1; filter: none; background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--c) 7%, transparent), transparent 70%); }
.bcard svg { width: 100%; aspect-ratio: 600 / 520; }
.bcard .bname { font-family: var(--font-display); font-weight: 300; font-size: 20px; line-height: 1.25; color: var(--ink); text-wrap: balance; }
.bcard.on .bname { color: var(--c); }
.bcard .bcount { font-size: 12px; color: var(--ink-faint); }
.bcard .bcount b { color: var(--ink); font-weight: 500; }
.bcard .open { margin-top: 2px; font-size: 12px; color: var(--c); letter-spacing: .08em; opacity: 0; transition: opacity var(--t-med); }
.bcard.on .open { opacity: 1; }
.pager { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 4px 16px 28px; color: var(--ink-faint); font-size: 12.5px; letter-spacing: .12em; }
.pager button { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-muted); transition: color var(--t-fast), background var(--t-fast); }
.pager button:hover { color: var(--c); background: var(--soft); }
.dots { display: flex; gap: 6px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); transition: background var(--t-med), transform var(--t-med); }
.dots i.on { background: var(--c); transform: scale(1.4); }

/* ── Estrelas (compartilhado) ──────────────────────────────────── */
.edge { stroke: var(--ink-faint); stroke-width: 1.4; opacity: .35; fill: none; }
.edge.lit { stroke: var(--c); opacity: .85; filter: drop-shadow(0 0 3px var(--glow)); }
.edge.alt { stroke-dasharray: 3 6; }
.edge.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--t-slow) var(--ease) forwards; animation-delay: calc(var(--i) * 40ms); }
.edge.alt.draw { stroke-dasharray: 3 6; stroke-dashoffset: 0; animation: fade-in var(--t-slow) var(--ease) both; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade-in { from { opacity: 0; } }
.star .base { fill: var(--bg); }
.star .ring { fill: none; stroke: var(--c); stroke-width: 1.6; }
.star.bloqueado .ring { stroke: var(--ink-faint); opacity: .7; }
.star.disponivel .ring { opacity: .8; }
.star .fill { fill: var(--c); }
.star .halo { fill: var(--c); opacity: .16; }
.star .prog { fill: none; stroke: var(--c); stroke-width: 2.2; stroke-linecap: round; }
.star .mirror { fill: none; stroke: var(--home); stroke-width: 1.2; stroke-dasharray: 1.5 3.5; }
.star.planejado .ring { stroke-dasharray: 2.5 3; }
.star.dominado .halo { animation: twinkle 4.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.7s); }
@keyframes twinkle { 0%, 100% { opacity: .12; } 50% { opacity: .3; } }
.star.estudando .pulse { fill: none; stroke: var(--c); stroke-width: 1; animation: pulse 2.4s var(--ease) infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(2.1); } }
.star .lbl { fill: var(--ink-muted); font-family: var(--font-body); font-size: 13.5px; text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; transition: fill var(--t-fast); }
.star.bloqueado .lbl { fill: var(--ink-faint); }
.star .tag { fill: var(--home); font-size: 10.5px; text-anchor: middle; letter-spacing: .04em; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }

/* ── Constelação expandida ─────────────────────────────────────── */
.branch { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
.sky-panel { display: flex; flex-direction: column; min-width: 0; padding: 4px 24px 20px; }
.branch-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.branch-head h1 { margin: 4px 0 0; font-family: var(--font-display); font-weight: 300; font-size: clamp(24px, 3vw, 34px); line-height: 1.15; color: var(--c); text-wrap: balance; }
.branch-head .eyebrow { color: var(--ink-faint); }
.branch-head .stat { font-size: 13px; color: var(--ink-faint); text-align: right; }
.branch-head .stat b { font-size: 22px; font-weight: 400; color: var(--ink); font-family: var(--font-display); }
.big-sky { flex: 1; min-height: 340px; display: grid; place-items: center; }
.big-sky svg { width: 100%; max-height: calc(100vh - 230px); overflow: visible; }
.big-sky .star { cursor: pointer; outline: none; }
.big-sky .star:hover .lbl, .big-sky .star:focus-visible .lbl, .big-sky .star.sel .lbl { fill: var(--ink); }
.big-sky .star .hit { fill: transparent; }
.big-sky .star.sel .ring { stroke-width: 2.4; }
.big-sky .star .selring { fill: none; stroke: var(--c); stroke-width: 1; opacity: 0; transition: opacity var(--t-med); }
.big-sky .star.sel .selring { opacity: .55; }
.big-sky.focus .edge { opacity: .12; }
.big-sky.focus .edge.rel { opacity: .95; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-faint); padding-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend svg { width: 18px; height: 18px; }
.empty-sky { color: var(--ink-faint); text-align: center; max-width: 34ch; font-size: 14px; }

.panel {
  border-left: 1px solid var(--line); background: color-mix(in srgb, var(--bg-raised) 88%, transparent);
  padding: 22px 22px 28px; display: flex; flex-direction: column; gap: 18px; min-width: 0; overflow-y: auto;
}
.panel .hint { color: var(--ink-faint); font-size: 13.5px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.25; }
.panel .home { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }
.panel .home i { font-style: normal; color: var(--home); }
.panel p { margin: 0; color: var(--ink-muted); font-size: 14px; }
.panel h3 { margin: 0 0 8px; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
.reqs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.reqs li { display: flex; gap: 10px; align-items: baseline; color: var(--ink-muted); }
.reqs .ok { color: var(--c); }
.reqs .no { color: var(--ink-faint); }
.reqs li small { color: var(--ink-faint); margin-left: auto; white-space: nowrap; font-family: var(--font-mono); font-size: 11px; }
.reqs .or { font-size: 11px; color: var(--ink-faint); padding-left: 22px; letter-spacing: .1em; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line-strong); color: var(--ink-muted); }
.pill .d { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); }
.pill.dominado, .pill.em_progresso, .pill.estudando, .pill.disponivel { border-color: color-mix(in srgb, var(--c) 45%, transparent); color: var(--c); }
.pill.dominado .d, .pill.em_progresso .d, .pill.estudando .d, .pill.disponivel .d { background: var(--c); box-shadow: 0 0 6px var(--c); }
.pips { display: inline-flex; gap: 5px; vertical-align: middle; }
.pips i { width: 16px; height: 4px; border-radius: 2px; background: var(--line-strong); transition: background var(--t-med); }
.pips i.on { background: var(--c); box-shadow: 0 0 6px var(--glow); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 18px; border-radius: 8px;
  border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); color: var(--c);
  font-size: 14px; font-weight: 500; transition: background var(--t-fast), box-shadow var(--t-fast);
}
.btn:hover { background: var(--soft); box-shadow: 0 0 18px var(--glow); }
.btn.ghost { border-color: var(--line-strong); color: var(--ink-muted); }
.btn.ghost:hover { color: var(--ink); background: var(--bg-panel); box-shadow: none; }

/* ── Página do nó (sóbria) ─────────────────────────────────────── */
.node { flex: 1; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 0 48px; max-width: 1120px; width: 100%; margin: 0 auto; padding: 8px 24px 64px; }
.node-head { grid-column: 1 / -1; display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; padding: 18px 0 30px; border-bottom: 1px solid var(--line); margin-bottom: 34px; }
.node-head .k { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-faint); letter-spacing: .06em; }
.node-head .k .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.node-head h1 { margin: 10px 0 8px; font-family: var(--font-display); font-weight: 300; font-size: clamp(30px, 4.4vw, 44px); line-height: 1.1; letter-spacing: -.01em; }
.node-head .tagline { margin: 0; color: var(--ink-muted); max-width: 60ch; font-size: 16px; }
.node-head .req-line { margin-top: 14px; font-size: 13px; color: var(--ink-faint); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.node-head .req-line b { font-weight: 400; color: var(--ink-muted); }
.node-head .req-line .ok { color: var(--c); }
.mastery-btn { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); transition: border-color var(--t-fast), background var(--t-fast); }
.mastery-btn:hover { border-color: color-mix(in srgb, var(--c) 45%, transparent); background: var(--bg-raised); }
.mastery-btn span { font-size: 12px; color: var(--ink-faint); }
.mastery-btn b { font-weight: 500; color: var(--ink); }

.guide { position: sticky; top: 20px; align-self: start; }
.guide ol { list-style: none; margin: 0; padding: 0; position: relative; }
.guide ol::before { content: ""; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 1px; background: var(--line-strong); }
.guide .fillline { position: absolute; left: 6px; top: 10px; width: 1px; background: var(--c); box-shadow: 0 0 6px var(--c); transition: height var(--t-slow) var(--ease); }
.guide li button { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; padding: 6px 0; text-align: left; font-size: 13.5px; color: var(--ink-faint); transition: color var(--t-fast); }
.guide li button:hover { color: var(--ink-muted); }
.guide li .pt { position: relative; z-index: 1; flex: 0 0 13px; height: 13px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--line-strong); transition: all var(--t-med) var(--ease); }
.guide li.read .pt { border-color: var(--c); background: color-mix(in srgb, var(--c) 30%, var(--bg)); }
.guide li.cur button { color: var(--ink); }
.guide li.cur .pt { border-color: var(--c); background: var(--c); box-shadow: 0 0 0 4px var(--soft), 0 0 12px var(--c); }
.guide .meta { margin-top: 18px; padding-left: 27px; font-size: 12px; color: var(--ink-faint); }

.reader { min-width: 0; max-width: 720px; }
.sec { animation: sec-in var(--t-med) var(--ease) both; }
@keyframes sec-in { from { opacity: 0; transform: translateY(8px); } }
.sec-top { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
.sec-top .n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); }
.sec-top h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.2; }
.prose p { margin: 0 0 14px; color: var(--ink-muted); max-width: 66ch; }
.prose p:first-child { color: var(--ink); font-size: 16.5px; }
.callout { border-left: 2px solid var(--c); padding: 4px 0 4px 20px; }
.callout h3 { margin: 0 0 8px; font-weight: 500; font-size: 16px; }
.callout p { margin: 0; color: var(--ink-muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.two h3 { margin: 0 0 12px; font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
.two .yes h3 { color: var(--c); }
.two .not h3 { color: var(--ink-faint); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; color: var(--ink-muted); font-size: 14.5px; }
.list li { display: flex; gap: 12px; }
.list li::before { content: ""; flex: 0 0 5px; height: 5px; margin-top: 10px; border-radius: 50%; background: var(--line-strong); }
.yes .list li::before { background: var(--c); }
.list.warn li::before { background: #ff7b8a; }
.bigo { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.bigo .v { font-family: var(--font-mono); font-size: 40px; color: var(--c); line-height: 1.1; text-shadow: 0 0 18px var(--glow); }
.bigo .l { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); margin: 10px 0 8px; }
.bigo p { margin: 0; color: var(--ink-muted); font-size: 14.5px; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 20px; flex-wrap: wrap; }
.seg button { padding: 6px 12px; border-radius: 7px; font-size: 13px; color: var(--ink-faint); transition: all var(--t-fast); }
.seg button.on { background: var(--bg-panel); color: var(--ink); }
.ex-input { font-family: var(--font-mono); font-size: 13.5px; color: var(--ink); background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 18px; overflow-x: auto; white-space: nowrap; }
.walk { list-style: none; margin: 0; padding: 0; counter-reset: w; display: flex; flex-direction: column; gap: 12px; }

const W = 600, H = 520, px = (x) => 50 + x * 500, py = (y) => 34 + y * 440;
function constellation(bid, { big = false, sel = null } = {}) {
  const area = AREA[BRANCH[bid].area];
  const ps = PLACE[bid] || [];
  const pos = Object.fromEntries(ps.map((p) => [p[0], p]));
  let edges = '', stars = '', ei = 0;
  ps.forEach(([slug]) => {
    NODES[slug].reqs.forEach((r) => {
      if (!pos[r.t] || r.rec) return;
      const a = pos[r.t], b = pos[slug];
      const rel = sel && (sel === slug || sel === r.t) ? ' rel' : '';
      edges += `<line class="edge${reqMet(r) ? ' lit' : ''}${r.group != null ? ' alt' : ''}${big ? ' draw' : ''}${rel}" style="--i:${ei++}" pathLength="1" x1="${px(a[2])}" y1="${py(a[3])}" x2="${px(b[2])}" y2="${py(b[3])}"/>`;
    });
  });
  ps.forEach(([slug, role, x, y], i) => {
    const n = NODES[slug], st = state(slug);
    const home = nodeArea(slug), mirror = n.home !== bid;
    const r = role === 't' ? (big ? 12 : 13) : (big ? 9 : 10);
    const cx = px(x), cy = py(y);
    let g = `<circle class="base" cx="${cx}" cy="${cy}" r="${r + 1}"/>`;
    if (st === 'dominado') g += `<circle class="halo" cx="${cx}" cy="${cy}" r="${r + 8}"/><circle class="fill" cx="${cx}" cy="${cy}" r="${r}"/>`;
    else {
      if (st === 'estudando') g += `<circle class="pulse" cx="${cx}" cy="${cy}" r="${r}"/>`;
      g += `<circle class="ring" cx="${cx}" cy="${cy}" r="${r}"/>`;
      if (st === 'em_progresso') {
        const C = 2 * Math.PI * (r + 4.5);
        g += `<circle class="prog" cx="${cx}" cy="${cy}" r="${r + 4.5}" stroke-dasharray="${(C * n.level) / n.max} ${C}" transform="rotate(-90 ${cx} ${cy})"/><circle class="fill" cx="${cx}" cy="${cy}" r="${r * 0.38}"/>`;
      }
    }
    if (mirror) g += `<circle class="mirror" cx="${cx}" cy="${cy}" r="${r + (st === 'dominado' ? 12 : 8.5)}"/>`;
    if (big) {
      g += `<circle class="selring" cx="${cx}" cy="${cy}" r="${r + 15}"/>`;
      g += `<text class="lbl" x="${cx}" y="${cy + r + 24}">${esc(n.title)}</text>`;
      if (mirror) g += `<text class="tag" x="${cx}" y="${cy + r + 38}">↗ ${esc(BRANCH[n.home].name)}</text>`;
      g += `<circle class="hit" cx="${cx}" cy="${cy}" r="${r + 18}"/>`;
    }
    const cls = `star ${st}${n.content === 'planejado' ? ' planejado' : ''}${sel === slug ? ' sel' : ''}`;
    const attrs = big ? ` tabindex="0" role="button" data-slug="${slug}" aria-label="${esc(n.title)}, ${STATE_LABEL[st]}${mirror ? ', espelho de ' + esc(BRANCH[n.home].name) : ''}"` : '';
    stars += `<g class="${cls}" style="--i:${i};--home:${home.color}"${attrs}>${g}</g>`;
  });
  if (!ps.length && !big) {
    stars = [[.5, .5], [.35, .3], [.68, .66]].map(([x, y], i) => `<circle cx="${px(x)}" cy="${py(y)}" r="${i ? 4 : 7}" fill="none" stroke="var(--ink-faint)" stroke-dasharray="2 3" opacity=".6"/>`).join('');
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="${big ? 'group' : 'img'}" aria-label="Constelação ${esc(BRANCH[bid].name)}" style="--c:${area.color}">${edges}${stars}</svg>`;
}

  intuition: [`Em vez de fixar um elemento e procurar o outro (o que obriga a varrer o resto do array para cada elemento), movemos os dois extremos para dentro guiados por uma comparação.`, `A pergunta que destrava o padrão é: "se esta combinação não serve, o que mais posso eliminar junto com ela?". Num array ordenado, a resposta costuma ser: uma linha ou coluna inteira da matriz de pares.`, `Concretamente: se nums[left] + nums[right] é grande demais, então nums[right] — o maior valor ainda disponível — não serve com NENHUM candidato restante, porque todos os outros são maiores ou iguais a nums[left]. Descartar right elimina de uma vez todos os pares que o incluíam.`],

    { title: 'Remover duplicados', input: 'nums = [0, 0, 1, 1, 2]', walk: [`slow marca onde o próximo valor único deve ser escrito; fast varre o array.`, `Quando nums[fast] difere de nums[slow], avança slow e copia.`, `Os dois andam para frente — variante de mesma direção, não de extremos opostos.`] },
  ],
  code: `// Extremos opostos — o template que precisa sair sem consulta.
function twoSumSorted(nums: number[], target: number): [number, number] | null {
  let left = 0;
  let right = nums.length - 1;

  while (left < right) {           // '<' e não '<=': um elemento não forma par
    const sum = nums[left] + nums[right];

    if (sum === target) return [left, right];

    if (sum > target) {
      right--;                     // o maior valor não serve com ninguém
    } else {
      left++;                      // o menor valor não serve com ninguém
    }
  }

  return null;                     // os ponteiros se cruzaram: não existe par
}

// Mesma direção (fast/slow) — a outra metade do padrão.
function removeDuplicates(nums: number[]): number {
  if (nums.length === 0) return 0;

  let slow = 0;
  for (let fast = 1; fast < nums.length; fast++) {
    if (nums[fast] !== nums[slow]) {
      slow++;
      nums[slow] = nums[fast];
    }
  }
  return slow + 1;
}`,

function trace(nums, target) {
  const s = []; let l = 0, r = nums.length - 1;
  s.push({ l, r, t: 'Posicionando os ponteiros', x: `left no início (valor ${nums[l]}) e right no fim (valor ${nums[r]}). Alvo: ${target}.` });

    <footer class="sec-foot">
      <button class="read-btn${read ? ' on' : ''}" id="readbtn" aria-pressed="${read}"><span class="check${read ? ' on' : ''}">${ico('check')}</span>${read ? 'Lida' : 'Marcar como lida'}</button>
      <div class="nav-btns">${idx > 0 ? `<button class="btn ghost" data-sec="${SECTIONS[idx - 1][0]}">${ico('left', '').replace('<svg', '<svg width="16" height="16"')} ${SECTIONS[idx - 1][1]}</button>` : ''}${idx < 11 ? `<button class="btn" data-next="${SECTIONS[idx + 1][0]}">${SECTIONS[idx + 1][1]} ${ico('right').replace('<svg', '<svg width="16" height="16"')}</button>` : ''}</div>
    </footer>
  </section>`;
  updateGuide();
  if (k === 'visualizacao') drawViz();
}
function hl(src) {
  const re = /(\/\/[^\n]*)|('(?:[^'\\]|\\.)*')|\b(function|let|const|return|if|else|while|for|null|number)\b|\b(\d+)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? 'cm' : m[2] ? 'st' : m[3] ? 'kw' : 'nu';
    out += `<span class="${cls}">${esc(m[0])}</span>`; last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

/* Visualizador Two Pointers */
function vizHTML() {
  const p = PRESETS[V.preset];
  return `<div class="viz">
    <div class="viz-top"><div class="seg" style="margin:0">${PRESETS.map((q, i) => `<button class="${i === V.preset ? 'on' : ''}" data-preset="${i}">Alvo ${q.target} · ${q.nums.length} itens</button>`).join('')}</div><span>target = <b>${p.target}</b></span></div>
    <div class="arr-wrap"><div class="arr" id="arr">${p.nums.map((v, i) => `<div class="cell" data-i="${i}"><span class="ix">${i}</span>${v}</div>`).join('')}<div class="ptr" id="pl">left</div><div class="ptr r" id="pr">right</div></div></div>
    <div class="narr" aria-live="polite"><h4 id="vt"></h4><p id="vx"></p></div>
    <div class="ctrl">
      <button class="ic" id="vreset" aria-label="Reiniciar">${ico('reset')}</button>
      <button class="ic" id="vprev" aria-label="Passo anterior">${ico('left')}</button>
      <button class="ic" id="vplay" aria-label="Reproduzir">${ico('play')}</button>
      <button class="ic" id="vnext" aria-label="Próximo passo">${ico('right')}</button>
      <div class="scrub"><i id="vbar"></i></div><span class="stepn" id="vn"></span>
    </div>
  </div>
  <p style="color:var(--ink-faint);font-size:13.5px;margin-top:14px">Comparar é um passo, mover é outro. Duas decisões nunca acontecem na mesma animação.</p>`;
}
function drawViz() {
  const st = V.steps[V.i], arr = document.getElementById('arr'); if (!arr) return;
  arr.querySelectorAll('.cell').forEach((c) => { const i = +c.dataset.i; c.className = 'cell' + (i < st.l || i > st.r ? ' gone' : '') + (st.found && (i === st.l || i === st.r) ? ' found' : st.hit && (i === st.l || i === st.r) ? ' hit' : ''); });
  document.getElementById('pl').style.setProperty('--p', st.l);
  document.getElementById('pr').style.setProperty('--p', st.r);
  document.getElementById('vt').textContent = st.t;
  document.getElementById('vx').textContent = st.x;
  document.getElementById('vbar').style.width = (V.i / (V.steps.length - 1)) * 100 + '%';
  document.getElementById('vn').textContent = `${V.i + 1} / ${V.steps.length}`;
  document.getElementById('vplay').innerHTML = ico(V.timer ? 'pause' : 'play');
  document.getElementById('vplay').setAttribute('aria-label', V.timer ? 'Pausar' : 'Reproduzir');
}
function stopViz() { if (V.timer) { clearInterval(V.timer); V.timer = null; } }
function vizStep(d) { V.i = Math.min(V.steps.length - 1, Math.max(0, V.i + d)); if (V.i === V.steps.length - 1) stopViz(); drawViz(); }

/* Gaveta de domínio */
function openDrawer() {
  const n = NODES[S.node]; const dr = document.getElementById('drawer');
  dr.style.setProperty('--c', nodeArea(S.node).color);
  if (S.node !== 'two-pointers') {
    dr.innerHTML = `<button class="x" id="dx" aria-label="Fechar">×</button><h2>Domínio</h2><p>Os critérios de cada nível aparecem quando o conteúdo deste nó for escrito.</p>`;
  } else {
    dr.innerHTML = `<button class="x" id="dx" aria-label="Fechar">×</button>
      <h2>Domínio de ${esc(n.title)}</h2>
      <p>O nível sobe quando todos os critérios dele estão marcados. Ao chegar no nível 2, Sliding Window é liberado na constelação.</p>
      ${TP.levels.map((L) => { const done = L.crit.every((c) => P.crit.includes(c[0])); return `<div class="lvl${done ? ' done' : ''}"><div class="lvl-h"><b>Nível ${L.n} · ${L.name}</b><span>${done ? 'atingido' : `${L.crit.filter((c) => P.crit.includes(c[0])).length}/${L.crit.length}`}</span></div>
        ${L.crit.map(([id, lab, txt]) => `<button class="crit" data-crit="${id}" aria-pressed="${P.crit.includes(id)}"><span class="check${P.crit.includes(id) ? ' on' : ''}">${ico('check')}</span><span><em>${lab}</em>${esc(txt)}</span></button>`).join('')}</div>`; }).join('')}
      <div class="stats"><div><b>${P.read.length}/12</b>guias lidas</div><div><b>${P.ex.length}/5</b>exercícios feitos</div></div>`;
  }
  document.body.classList.add('drawer-open');
  document.getElementById('dx').onclick = closeDrawer;
  document.getElementById('dx').focus();
}
function closeDrawer() { document.body.classList.remove('drawer-open'); document.getElementById('mastery')?.focus(); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); }

/* ═════════════════════════ EVENTOS ═════════════════════════ */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-go]'); if (!t) return;
  const d = t.dataset;
  if (d.go === 'areas') return go({ view: 'areas', sel: null });
  if (d.crumb === 'area') return go({ view: 'area', sel: null });
  if (d.crumb === 'branch') return go({ view: 'branch', branch: S.view === 'node' ? (S.from && (PLACE[S.from] || []).some((p) => p[0] === S.node) ? S.from : NODES[S.node].home) : S.branch, sel: S.view === 'node' ? S.node : S.sel });
  if (d.area) return openArea(d.area, t);
  if (d.b != null) { if (document.getElementById('car')?.dataset.swiped) return; const i = +d.b; if (i === S.bIdx) return go({ view: 'branch', branch: AREA[S.area].branches[i].id, sel: null }); S.bIdx = i; return positionTrack(); }
  if (d.open) return openNode(d.open);
  if (d.jump) { const b = BRANCH[d.jump]; return go({ view: 'branch', branch: d.jump, area: b.area, bIdx: AREA[b.area].branches.indexOf(b), sel: S.sel }); }
  if (d.sec) { S.sec = d.sec; renderSection(); return document.querySelector('.reader')?.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  if (d.next) { if (!P.read.includes(S.sec)) { P.read.push(S.sec); save(); } S.sec = d.next; renderSection(); return document.querySelector('.reader')?.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  if (t.id === 'readbtn') { P.read = P.read.includes(S.sec) ? P.read.filter((x) => x !== S.sec) : [...P.read, S.sec]; save(); return renderSection(); }
  if (d.ex != null) { S.ex = +d.ex; return renderSection(); }
  if (d.exid) { P.ex = P.ex.includes(d.exid) ? P.ex.filter((x) => x !== d.exid) : [...P.ex, d.exid]; save(); return renderSection(); }
  if (t.classList.contains('flash')) { t.classList.toggle('open'); return t.setAttribute('aria-expanded', t.classList.contains('open')); }
  if (t.id === 'copy') { navigator.clipboard?.writeText(TP.code).then(() => toast('Código copiado'), () => toast('Selecione o código para copiar')); return; }
  if (d.preset != null) { V.preset = +d.preset; V.i = 0; V.steps = trace(PRESETS[V.preset].nums, PRESETS[V.preset].target); return renderSection(); }
  if (t.id === 'vnext') { stopViz(); return vizStep(1); }
  if (t.id === 'vprev') { stopViz(); return vizStep(-1); }
  if (t.id === 'vreset') { stopViz(); V.i = 0; return drawViz(); }
  if (t.id === 'vplay') { if (V.timer) { stopViz(); return drawViz(); } if (V.i === V.steps.length - 1) V.i = 0; V.timer = setInterval(() => vizStep(1), 1300); return drawViz(); }
  if (d.crit) {
    const before = NODES['two-pointers'].level;
    P.crit = P.crit.includes(d.crit) ? P.crit.filter((x) => x !== d.crit) : [...P.crit, d.crit]; save();
    recomputeTPLevel(); const after = NODES['two-pointers'].level;
    openDrawer(); document.querySelector(`[data-crit="${d.crit}"]`)?.focus();
    const mb = document.getElementById('mastery'); if (mb) mb.innerHTML = `<span>Domínio</span><span class="pips">${[0, 1, 2].map((i) => `<i class="${i < after ? 'on' : ''}"></i>`).join('')}</span><span><b>Nível ${after}</b> de 3</span>`;
    if (after > before) toast(after >= 2 && before < 2 ? `Nível ${after} atingido · Sliding Window liberado` : `Nível ${after} atingido`);
    else if (after < before) toast(`Voltou ao nível ${after}`);
  }
});
document.getElementById('scrim').onclick = closeDrawer;
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.body.classList.contains('drawer-open')) return closeDrawer();
    if (S.view === 'node') return document.querySelector('[data-crumb="branch"]')?.click();
    if (S.view === 'branch') { if (S.sel) { S.sel = null; return render(); } return go({ view: 'area', area: BRANCH[S.branch].area }); }
    if (S.view === 'area') return go({ view: 'areas' });
  }
  if (S.view === 'area' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { shift(e.key === 'ArrowRight' ? 1 : -1); document.querySelector('.bcard.on')?.focus({ preventScroll: true }); }
  if (S.view === 'node' && !document.body.classList.contains('drawer-open') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.closest('.viz')) {
    const i = SECTIONS.findIndex((s) => s[0] === S.sec) + (e.key === 'ArrowRight' ? 1 : -1);
    if (i >= 0 && i < 12) { S.sec = SECTIONS[i][0]; renderSection(); }
  }
});
addEventListener('resize', () => { if (S.view === 'area') positionTrack(); if (S.view === 'node') updateGuide(); });

/* ═════════════════════════ CÉU DE FUNDO ═════════════════════════ */
(function stars() {
  const cv = document.getElementById('stars'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let pts = [], w, h, dpr;
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  function size() {
    dpr = Math.min(2, devicePixelRatio || 1); w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed = 7; pts = Array.from({ length: Math.round((w * h) / 9000) }, () => ({ x: rnd() * w, y: rnd() * h, r: rnd() * 0.9 + 0.2, a: rnd() * 0.5 + 0.1, p: rnd() * 6.28, s: rnd() * 0.6 + 0.2 }));
  }
  function frame(t) {
    ctx.clearRect(0, 0, w, h);
    for (const p of pts) { const a = reduce ? p.a : p.a * (0.65 + 0.35 * Math.sin(t / 1000 * p.s + p.p)); ctx.fillStyle = `rgba(190,210,255,${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
    if (!reduce) requestAnimationFrame(frame);
  }
  size(); addEventListener('resize', () => { size(); if (reduce) frame(0); }); requestAnimationFrame(frame);
})();

render();
</script>
